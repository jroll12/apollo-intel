# Deploy config for a run started from inside fun-focus/.
#
# The repo-root netlify.toml sets `base = "fun-focus"` and is what a
# git-connected build uses; this file repeats the same paths so both entry
# points behave identically. Keep the two in sync.

[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'static site — nothing to build'"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
